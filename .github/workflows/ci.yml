name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access or cloud credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned to commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      # GitHub-hosted runners have Docker, so Testcontainers starts a real PostgreSQL.
      - run: ./mvnw -B verify

  statement-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: statement-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: statement-worker/pom.xml
      # Kotlin tests, including the S3 store against S3Mock in Testcontainers; builds the Lambda jar.
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # Type check plus production build.
      - run: npm run build

  docker-image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file api/Dockerfile --tag splitledger-api:ci .

  # The web page in a real browser against the real stack (API, PostgreSQL, built page) from
  # docker compose. GitHub's Ubuntu runners have Chrome installed; playwright-core drives it.
  e2e:
    runs-on: ubuntu-24.04
    needs: [test, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: |
          printf 'DB_PASSWORD=%s
APP_DB_PASSWORD=%s
' "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env
          docker compose up --build --detach --wait
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run e2e -- http://localhost:8080
        working-directory: web
        env:
          SCREENSHOTS: ${{ github.workspace }}/e2e-screenshots
      - if: failure()
        run: docker compose logs api
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: e2e-screenshots
