# Local run: API + PostgreSQL. Copy .env.example to .env first.
name: splitledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitledger
      POSTGRES_USER: splitledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
    # Bound to localhost only, so the database is never reachable from the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitledger -d splitledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/splitledger
      # Same split as on AWS: Flyway migrates as the owner, the application runs as the
      # least-privilege role splitledger_app (see V7__application_role.sql).
      SPRING_FLYWAY_USER: splitledger
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      DB_USER: splitledger_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (see .env.example)}
      # Locally every account comes from the same address; the browser walkthrough alone creates
      # six. A public host keeps the default of 5 per hour (deploy/free-host).
      SPLITLEDGER_SIGNUP_LIMIT_PER_HOUR: ${SIGNUP_LIMIT_PER_HOUR:-100}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  db-data:
