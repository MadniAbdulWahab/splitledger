spring:
  application:
    name: splitledger-api
  autoconfigure:
    # Authentication is by API token only; without this Boot would create a default user with a
    # generated password and print it to the log.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splitledger}
    username: ${DB_USER:splitledger}
    password: ${DB_PASSWORD:}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # No lazy loading during JSON rendering: every query happens inside the service layer.
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # A month of statement lines is a few KB; the limit keeps uploads from filling memory.
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  # The web app's manifest (installing it on a phone) has its own media type.
  mime-mappings:
    webmanifest: application/manifest+json
